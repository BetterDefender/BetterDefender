<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-labelledby="title desc">
  <title id="title">GitHub telemetry — Gh0stX</title>
  <desc id="desc">A snapshot panel showing 43 public repositories, 99 stars, 9 original tools and an active GitHub presence since 2019.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090E17"/>
      <stop offset="1" stop-color="#060A10"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.03" cy="0" r="0.75">
      <stop offset="0" stop-color="#FF2D55" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF2D55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="1" cy="1" r="0.7">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#172333" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="998" height="148" rx="10"/>
    </clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; }
      @keyframes sweep { 0% { transform: translateX(0); } 100% { transform: translateX(1080px); } }
      .sweep { animation: sweep 9s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .sweep { animation: none; } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="149" rx="10" fill="url(#bg)" stroke="#1E2B3D"/>
  <rect x="1" y="1" width="998" height="148" rx="10" fill="url(#grid)" opacity="0.3"/>
  <rect x="1" y="1" width="998" height="148" rx="10" fill="url(#redGlow)"/>
  <rect x="1" y="1" width="998" height="148" rx="10" fill="url(#cyanGlow)"/>

  <g class="mono">
    <rect x="26" y="22" width="6" height="6" fill="#FF2D55"/>
    <text x="40" y="29" font-size="9.5" letter-spacing="2" fill="#FF2D55">GITHUB // TELEMETRY</text>
    <text x="974" y="29" text-anchor="end" font-size="8" letter-spacing="1.2" fill="#44546A">SNAPSHOT // 2026.10</text>
  </g>
  <path d="M26 40H974" stroke="#1B2635"/>

  <g class="mono">
    <rect x="26" y="62" width="3" height="22" fill="#FF2D55"/>
    <text x="40" y="88" font-size="38" font-weight="700" fill="#F2F6FB">43</text>
    <text x="40" y="112" font-size="9" letter-spacing="1.6" fill="#7D8B9E">PUBLIC REPOS</text>
    <text x="40" y="130" font-size="8" letter-spacing="1" fill="#3F4E62">SOURCE CODE</text>
  </g>
  <path d="M257 56V132" stroke="#1B2635"/>

  <g class="mono">
    <rect x="268" y="62" width="3" height="22" fill="#FF2D55"/>
    <text x="282" y="88" font-size="38" font-weight="700" fill="#F2F6FB">99</text>
    <text x="282" y="112" font-size="9" letter-spacing="1.6" fill="#7D8B9E">STARS</text>
    <text x="282" y="130" font-size="8" letter-spacing="1" fill="#3F4E62">COMMUNITY SIGNAL</text>
  </g>
  <path d="M499 56V132" stroke="#1B2635"/>

  <g class="mono">
    <rect x="510" y="62" width="3" height="22" fill="#FF2D55"/>
    <text x="524" y="88" font-size="38" font-weight="700" fill="#F2F6FB">09</text>
    <text x="524" y="112" font-size="9" letter-spacing="1.6" fill="#7D8B9E">ORIGINAL TOOLS</text>
    <text x="524" y="130" font-size="8" letter-spacing="1" fill="#3F4E62">SHIPPED</text>
  </g>
  <path d="M741 56V132" stroke="#1B2635"/>

  <g class="mono">
    <rect x="752" y="62" width="3" height="22" fill="#FF2D55"/>
    <text x="766" y="88" font-size="38" font-weight="700" fill="#F2F6FB">2019</text>
    <text x="766" y="112" font-size="9" letter-spacing="1.6" fill="#7D8B9E">ACTIVE SINCE</text>
    <text x="766" y="130" font-size="8" letter-spacing="1" fill="#3F4E62">07 YEARS</text>
  </g>

  <rect class="sweep" x="-40" y="1" width="40" height="148" fill="url(#sweep)" clip-path="url(#frame)"/>
</svg>
