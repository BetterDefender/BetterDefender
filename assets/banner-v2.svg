<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Gh0stX — Red Team Operator</title>
  <desc id="desc">A dark, terminal-styled profile banner with the GH0STX wordmark and an animated red-team console.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/>
      <stop offset="0.55" stop-color="#090E17"/>
      <stop offset="1" stop-color="#05080D"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.07" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#FF2D55" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#FF2D55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.95" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#A9BACC"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D55"/>
      <stop offset="0.55" stop-color="#FF2D55" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF2D55" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D55"/>
      <stop offset="0.45" stop-color="#FF2D55" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C121C"/>
      <stop offset="1" stop-color="#080D15"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF2D55" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF2D55" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FF2D55" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1C2A3B" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.03"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="340" rx="12"/>
    </clipPath>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; }
      .ln { opacity: 1; animation: reveal 0.01s linear both; }
      .d1 { animation-delay: 0.20s; }
      .d2 { animation-delay: 0.45s; }
      .d3 { animation-delay: 0.70s; }
      .d4 { animation-delay: 0.95s; }
      .d5 { animation-delay: 1.10s; }
      .d6 { animation-delay: 1.25s; }
      .d7 { animation-delay: 1.45s; }
      .d8 { animation-delay: 1.75s; }
      @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%,45% { opacity: 1; } 46%,100% { opacity: 0; } }
      .cursor { animation: blink 1.05s steps(1) infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(420px); } }
      .scan { animation: scan 8s linear infinite; }
      @keyframes glitchA {
        0%,90%,100% { transform: translate(0,0); opacity: 0.35; }
        91% { transform: translate(-4px,1px); opacity: 0.7; }
        93% { transform: translate(3px,-1px); opacity: 0.25; }
        95% { transform: translate(-2px,0); opacity: 0.6; }
        97% { transform: translate(2px,1px); opacity: 0.3; }
      }
      @keyframes glitchB {
        0%,92%,100% { transform: translate(0,0); opacity: 0.28; }
        93% { transform: translate(4px,-1px); opacity: 0.5; }
        95% { transform: translate(-3px,1px); opacity: 0.2; }
        97% { transform: translate(2px,0); opacity: 0.45; }
      }
      .ga { animation: glitchA 7s steps(1) infinite; }
      .gb { animation: glitchB 7s steps(1) infinite; }
      .seg { opacity: 1; animation: segIn 0.01s linear both; }
      @keyframes segIn { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .ln, .cursor, .pulse, .scan, .ga, .gb, .seg { animation: none; }
        .ln, .seg { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity="0.45"/>
    <rect width="1200" height="340" fill="url(#redGlow)"/>
    <rect width="1200" height="340" fill="url(#cyanGlow)"/>
    <rect width="1200" height="340" fill="url(#scanlines)"/>
    <rect width="1200" height="2" fill="url(#topLine)"/>
  </g>

  <path d="M26 48V26H48" fill="none" stroke="#FF2D55" stroke-width="1.5" opacity="0.8"/>
  <path d="M1174 292V314H1152" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.55"/>

  <g class="mono">
    <text x="64" y="64" font-size="10.5" letter-spacing="2">
      <tspan fill="#FF2D55">[ 0x00 ]</tspan>
      <tspan fill="#22D3EE" dx="10">RED TEAM // OPERATOR PROFILE</tspan>
    </text>

    <g class="ga">
      <text x="62" y="148" font-size="82" font-weight="800" letter-spacing="3" fill="#FF2D55">GH0STX</text>
    </g>
    <g class="gb">
      <text x="66" y="148" font-size="82" font-weight="800" letter-spacing="3" fill="#22D3EE">GH0STX</text>
    </g>
    <text x="64" y="148" font-size="82" font-weight="800" letter-spacing="3" fill="url(#nameGrad)">GH0STX</text>

    <rect x="64" y="166" width="300" height="2" fill="url(#accentGrad)"/>
    <rect x="64" y="166" width="26" height="2" fill="#FF2D55"/>

    <text x="64" y="200" font-size="13" letter-spacing="1.6" fill="#9FB0C4">ADVERSARY SIMULATION  ·  OFFENSIVE TOOLING  ·  AI SECURITY</text>
    <text x="64" y="230" font-size="13" letter-spacing="1.4" fill="#7F90A5">OFFENSE INFORMS DEFENSE <tspan fill="#22D3EE">//</tspan> BUILD · BREAK · DEFEND</text>
    <text x="64" y="278" font-size="11.5" letter-spacing="0.8" fill="#FF2D55">github.com/BetterDefender</text>
    <text x="272" y="278" font-size="11.5" fill="#48586C">// EST. 2019</text>
    <text x="64" y="314" font-size="8.5" letter-spacing="1.4" fill="#3F4E62">[ SESSION ENCRYPTED // AES-256-GCM ]</text>
  </g>

  <g>
    <rect x="672" y="52" width="500" height="238" rx="10" fill="url(#termBg)" stroke="#223047" filter="url(#panelShadow)"/>
    <path d="M672 62Q672 52 682 52H1162Q1172 52 1172 62V82H672Z" fill="#0E1622"/>
    <circle cx="690" cy="67" r="3.5" fill="#FF5F57"/>
    <circle cx="706" cy="67" r="3.5" fill="#FEBC2E"/>
    <circle cx="722" cy="67" r="3.5" fill="#28C840"/>
    <path d="M672 82H1172" stroke="#1C2939" stroke-width="1"/>
    <g class="mono">
      <text x="922" y="71" text-anchor="middle" font-size="10" fill="#6E7C91">gh0stx@redteam — zsh</text>
      <text x="1158" y="71" text-anchor="end" font-size="8.5" fill="#3D4C60">TTY 01</text>

      <g class="ln d1">
        <text x="692" y="108" font-size="14.5" fill="#FF2D55">$</text>
        <text x="705" y="108" font-size="14.5" fill="#E6EDF3">whoami</text>
      </g>
      <g class="ln d2">
        <text x="692" y="129.5" font-size="14.5" fill="#3DFFA2">red_team_operator</text>
      </g>
      <g class="ln d3">
        <text x="692" y="151" font-size="14.5" fill="#FF2D55">$</text>
        <text x="705" y="151" font-size="14.5" fill="#E6EDF3">cat mission.txt</text>
      </g>
      <g class="ln d4">
        <text x="692" y="172.5" font-size="14.5" fill="#FF2D55">[*]</text>
        <text x="722" y="172.5" font-size="14.5" fill="#22D3EE">adversary simulation</text>
      </g>
      <g class="ln d5">
        <text x="692" y="194" font-size="14.5" fill="#FF2D55">[*]</text>
        <text x="722" y="194" font-size="14.5" fill="#22D3EE">offensive tooling</text>
      </g>
      <g class="ln d6">
        <text x="692" y="215.5" font-size="14.5" fill="#FF2D55">[*]</text>
        <text x="722" y="215.5" font-size="14.5" fill="#22D3EE">ai × security</text>
      </g>
      <g class="ln d7">
        <text x="692" y="237" font-size="14.5" fill="#FF2D55">$</text>
        <text x="705" y="237" font-size="14.5" fill="#E6EDF3">./engage.sh --opsec</text>
        <rect class="cursor" x="877" y="225.5" width="7" height="14.5" fill="#FF2D55"/>
      </g>
      <g class="ln d8">
        <text x="692" y="259" font-size="14.5" fill="#5E6E84">[</text>
        <rect x="706" y="252.5" width="186" height="8" rx="2" fill="#16202E"/>
        <rect class="seg" style="animation-delay:1.80s" x="706.0" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:1.84s" x="713.5" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:1.88s" x="721.0" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:1.92s" x="728.5" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:1.96s" x="736.0" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.00s" x="743.5" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.04s" x="751.0" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.08s" x="758.5" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.12s" x="766.0" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.16s" x="773.5" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.20s" x="781.0" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.24s" x="788.5" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.28s" x="796.0" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.32s" x="803.5" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.36s" x="811.0" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.40s" x="818.5" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.44s" x="826.0" y="252.5" width="5.5" height="8" rx="1" fill="#FF2D55"/>
        <rect class="seg" style="animation-delay:2.48s" x="833.5" y="252.5" width="5.5" height="8" rx="1" fill="#FF7A45"/>
        <text x="898" y="259" font-size="14.5" fill="#5E6E84">]</text>
        <text x="910" y="259" font-size="14.5" fill="#FF2D55">72%</text>
      </g>
    </g>
  </g>

  <g class="mono">
    <text transform="translate(1188 76) rotate(90)" font-size="7.5" letter-spacing="2" fill="#7A1B2E">AUTHORIZED ACCESS ONLY</text>
    <text x="1172" y="330" text-anchor="end" font-size="8" letter-spacing="1.2" fill="#3F4E62">[ ACCESS LOGGED ]</text>
  </g>

  <rect class="scan" x="0" y="-90" width="1200" height="90" fill="url(#scanGrad)" clip-path="url(#frame)"/>
</svg>
