<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="112" viewBox="0 0 1000 112" role="img" aria-labelledby="title desc">
  <title id="title">Break it. Understand it. Defend better.</title>
  <desc id="desc">A terminal-style sign-off reading: offense informs defense, break it, understand it, defend better.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090E17"/>
      <stop offset="1" stop-color="#060A10"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D55" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#FF2D55" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FF2D55" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.02" cy="0" r="0.9">
      <stop offset="0" stop-color="#FF2D55" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FF2D55" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#172333" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; }
      .cjk { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif; }
      @keyframes blink { 0%,45% { opacity: 1; } 46%,100% { opacity: 0; } }
      .cursor { animation: blink 1.05s steps(1) infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cursor, .pulse { animation: none; } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="111" rx="10" fill="url(#bg)" stroke="#1E2B3D"/>
  <rect x="1" y="1" width="998" height="110" rx="10" fill="url(#grid)" opacity="0.28"/>
  <rect x="1" y="1" width="998" height="110" rx="10" fill="url(#redGlow)"/>
  <rect x="1" y="1" width="998" height="2" fill="url(#topLine)"/>

  <g class="mono">
    <text x="26" y="34" font-size="11.5" letter-spacing="0.5">
      <tspan fill="#44546A">┌──(</tspan>
      <tspan fill="#3DFFA2">gh0stx</tspan>
      <tspan fill="#5E6E84">@</tspan>
      <tspan fill="#FF2D55">redteam</tspan>
      <tspan fill="#44546A">)-[~]</tspan>
    </text>

    <text x="26" y="62" font-size="12.5">
      <tspan fill="#44546A">└─</tspan>
      <tspan fill="#FF2D55">$</tspan>
      <tspan fill="#E6EDF3" dx="10">echo </tspan>
      <tspan fill="#5E6E84">"</tspan>
      <tspan class="cjk" fill="#3DFFA2">以攻促防 · 以战止战</tspan>
      <tspan fill="#5E6E84">"</tspan>
    </text>

    <text class="cjk" x="58" y="90" font-size="12.5" fill="#3DFFA2">以攻促防 · 以战止战</text>
    <text x="192" y="90" font-size="12.5" letter-spacing="0.6" fill="#7D8B9E">// BREAK IT. UNDERSTAND IT. DEFEND BETTER.</text>
    <rect class="cursor" x="524" y="78" width="7" height="14" fill="#3DFFA2"/>

    <text x="974" y="62" text-anchor="end" font-size="9" letter-spacing="1.2" fill="#3F4E62">[ EOF ]</text>
    <circle class="pulse" cx="890" cy="86" r="3" fill="#3DFFA2"/>
    <text x="902" y="90" font-size="9" letter-spacing="1.2" fill="#3DFFA2">OPERATIONAL</text>
  </g>
</svg>
